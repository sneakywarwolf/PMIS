name: Publish Docker images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Each architecture is built on a runner of that architecture, so nothing is emulated.
  build:
    name: build ${{ matrix.app }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: backend,  arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { app: backend,  arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { app: frontend, arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { app: frontend, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # package.json is the fallback source of the version shown in the app, so it carries the release too.
      - name: Stamp the release version
        env:
          TAG: ${{ github.ref_name }}
        working-directory: apps/${{ matrix.app }}
        run: npm pkg set version="${TAG#v}"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/${{ matrix.app }}
          platforms: ${{ matrix.platform }}
          # The backend reports this as its version (About page, update check); the frontend has no use for it.
          build-args: ${{ matrix.app == 'backend' && format('APP_VERSION={0}', github.ref_name) || '' }}
          # Push the image by digest only; the merge job below creates the tags.
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/pmis-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-architecture tag per app, assembled from the two digests.
  merge:
    name: publish ${{ matrix.app }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digests-${{ matrix.app }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push the multi-arch manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pmis-${{ matrix.app }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create \
            -t "${IMAGE}:${version}" -t "${IMAGE}:latest" \
            "${refs[@]}"
      - name: Show the result
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pmis-${{ matrix.app }}
        run: docker buildx imagetools inspect "${IMAGE}:latest"
