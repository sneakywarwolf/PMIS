name: Publish Docker images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        run: |
          for app in backend frontend; do
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${{ secrets.DOCKERHUB_USERNAME }}/pmis-$app:${{ steps.v.outputs.version }} \
              -t ${{ secrets.DOCKERHUB_USERNAME }}/pmis-$app:latest \
              --push apps/$app
          done
