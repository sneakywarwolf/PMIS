name: security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

# A newer push to the same PR/branch makes the older run pointless.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - working-directory: apps/backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npx jest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: typecheck
        working-directory: apps/frontend
        run: |
          npm ci
          npx tsc --noEmit

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: npm audit backend (fails on high/critical)
        working-directory: apps/backend
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high
      # package.json "overrides" pins the PostCSS bundled in Next to a patched release; drop it once Next ships one.
      - name: npm audit frontend (fails on high/critical)
        working-directory: apps/frontend
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --redact --no-banner

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/security.yml
      - name: semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/typescript --config p/nodejs --config p/secrets --error apps/backend/src apps/frontend/src
