name: security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

# A newer push to the same PR/branch makes the older run pointless.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - working-directory: apps/backend
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npx jest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: typecheck
        working-directory: apps/frontend
        run: |
          npm ci
          npx tsc --noEmit

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: npm audit backend (fails on high/critical)
        working-directory: apps/backend
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high
      # package.json "overrides" pins the PostCSS bundled in Next to a patched release; drop it once Next ships one.
      - name: npm audit frontend (fails on high/critical)
        working-directory: apps/frontend
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          # Verify the download against the SHA-256 published in the release's checksums file (checked on 2026-11-11).
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --redact --no-banner

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/security.yml
      - name: semgrep
        run: |
          pip install semgrep==1.185.0
          semgrep scan --config p/typescript --config p/nodejs --config p/secrets --error apps/backend/src apps/frontend/src

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: build and scan images (trivy, fails on high/critical)
        env:
          # Official Trivy image, pinned by digest so the scanner can't change under a reused tag.
          TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          docker build -t pmis-backend:ci apps/backend
          docker build -t pmis-frontend:ci apps/frontend
          # Run Trivy from its container: reads local images via the Docker socket, writes reports to the workspace.
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY_IMAGE" "$@"
          }
          for i in backend frontend; do
            trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed pmis-$i:ci
            trivy image --format cyclonedx --output sbom-$i.json pmis-$i:ci
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom-*.json
