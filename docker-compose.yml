# PMIS (VAPT Command Center) - production-style deployment.
#   1. cp .env.example .env   and fill in every CHANGE_ME value
#   2. docker compose up -d
#   3. open http://localhost:${FRONTEND_PORT:-3000}
# Only the frontend is published; the API, database, cache and storage stay on the internal network.
# ($ in .env values must be written as $$.)

services:
  frontend:
    image: ${PMIS_IMAGE_REPO:-sneakywarwolf}/pmis-frontend:${PMIS_VERSION:-latest}
    build:
      context: ./apps/frontend
    restart: unless-stopped
    # Hardening: no privilege gain, no Linux capabilities (the app only listens on an unprivileged port), bounded process count.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    # Read-only root filesystem: the app writes only to these in-memory scratch areas (Next's image cache, temp files).
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /app/.next/cache:size=256m
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  backend:
    image: ${PMIS_IMAGE_REPO:-sneakywarwolf}/pmis-backend:${PMIS_VERSION:-latest}
    build:
      context: ./apps/backend
      args:
        # Building from source: PMIS_VERSION (e.g. 1.0.10) becomes the version shown on the About page.
        # "latest" is not a version and is ignored (package.json is used instead).
        APP_VERSION: ${PMIS_VERSION:-}
    restart: unless-stopped
    # Hardening: no privilege gain, no Linux capabilities (the app only listens on an unprivileged port), bounded process count.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    # Read-only root filesystem: the app writes only to this in-memory scratch area (uploads are streamed or held in memory).
    read_only: true
    tmpfs:
      - /tmp:size=256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://pmis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pmis?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)}@redis:6379
      MINIO_ENDPOINT: rustfs
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-pmisminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: vapt-reports
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Cyberdigest (all optional; see the User Guide). TIME/MODE only seed the first run: afterwards the Administration tab owns them.
      CYBERDIGEST_DIGEST_TIME: ${CYBERDIGEST_DIGEST_TIME:-}
      CYBERDIGEST_DIGEST_MODE: ${CYBERDIGEST_DIGEST_MODE:-}
      CYBERDIGEST_REQUIRE_SECOND_APPROVER: ${CYBERDIGEST_REQUIRE_SECOND_APPROVER:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-false}

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pmis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmis -d pmis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)}
    # Password required for every connection (the stack's network is internal, but any container on it could otherwise
    # read or tamper with sessions, rate limits and job queues). Use a hex value so it is safe inside the REDIS_URL.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage (reports, templates, PoC images). The backend's MINIO_* settings and the
  # MINIO_ROOT_* variables keep their names so existing .env files work; they are the S3 access and secret key.
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.3}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-pmisminio}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # The web console is not used by PMIS (the backend talks to the S3 API on port 9000 only), so it is switched off.
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
