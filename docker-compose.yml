version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vapt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vapt_user
      POSTGRES_PASSWORD: vapt_secure_password_2024
      POSTGRES_DB: vapt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapt_user -d vapt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vapt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction

  minio:
    image: minio/minio:latest
    container_name: vapt-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: vaptminioadmin
      MINIO_ROOT_PASSWORD: vaptminioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
