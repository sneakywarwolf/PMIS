# DEVELOPMENT ONLY: infrastructure (Postgres/Redis/RustFS) published on localhost for running the apps with npm.
# Uses fixed local-only credentials - never expose this to a network. For real deployments use docker-compose.yml.
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vapt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vapt_user
      POSTGRES_PASSWORD: vapt_secure_password_2024
      POSTGRES_DB: vapt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapt_user -d vapt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vapt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.3}
    container_name: vapt-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: vaptminioadmin
      RUSTFS_SECRET_KEY: vaptminioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
